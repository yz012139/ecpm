name: build-dylib

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取仓库
        uses: actions/checkout@v4

      - name: 安装依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld make curl unzip xz-utils
          clang --version | head -2
          echo "--- 可用 lld ---"
          ls -la /usr/bin/*lld* 2>/dev/null || true
          which ld64.lld || true

      - name: 下载 iOS SDK
        run: |
          mkdir -p "$HOME/sdk"
          curl -L -o /tmp/sdks.zip https://codeload.github.com/theos/sdks/zip/refs/heads/master
          unzip -q /tmp/sdks.zip -d /tmp
          cp -r /tmp/sdks-master/iPhoneOS14.5.sdk "$HOME/sdk/" 2>/dev/null || \
          cp -r /tmp/sdks-master/*.sdk "$HOME/sdk/"
          ls "$HOME/sdk"

      - name: 编译 arm64 + arm64e
        run: |
          SDK="$HOME/sdk/iPhoneOS14.5.sdk"
          LLD="$(command -v ld64.lld || true)"
          echo "ld64.lld = $LLD"
          FUSE=""
          if [ -n "$LLD" ]; then FUSE="-fuse-ld=$LLD"; else FUSE="-fuse-ld=lld"; fi
          for ARCH in arm64 arm64e; do
            echo "==== $ARCH ===="
            clang -target ${ARCH}-apple-ios14.0 -isysroot "$SDK" -dynamiclib \
              -fobjc-arc -fblocks -O2 -fno-stack-protector $FUSE \
              -framework UIKit -framework Foundation -framework CoreGraphics \
              -Wl,-undefined,dynamic_lookup \
              -Wl,-install_name,@rpath/EcpmCtrl.dylib \
              -o "EcpmCtrl-$ARCH.dylib" theos/Tweak.xm 2>&1 | tee "build-$ARCH.log"
            echo "exit=$?"
          done
          ls -la *.dylib || true

      - name: 合并成 fat dylib
        run: |
          if [ -f EcpmCtrl-arm64.dylib ] && [ -f EcpmCtrl-arm64e.dylib ]; then
            (command -v lipo >/dev/null && lipo -create EcpmCtrl-arm64.dylib EcpmCtrl-arm64e.dylib -output EcpmCtrl.dylib) || \
            cp EcpmCtrl-arm64.dylib EcpmCtrl.dylib
          else
            cp EcpmCtrl-arm64.dylib EcpmCtrl.dylib || true
          fi
          ls -la EcpmCtrl.dylib || true

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: EcpmCtrl-dylib
          path: |
            EcpmCtrl.dylib
            EcpmCtrl-arm64.dylib
            EcpmCtrl-arm64e.dylib
            build-*.log
          if-no-files-found: warn
