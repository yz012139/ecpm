name: qrkit-build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld make curl unzip xz-utils
          clang --version | head -2

      - name: 下载 iOS SDK
        run: |
          mkdir -p "$HOME/sdk"
          curl -L -o /tmp/sdks.zip https://codeload.github.com/theos/sdks/zip/refs/heads/master
          unzip -q /tmp/sdks.zip -d /tmp
          cp -r /tmp/sdks-master/iPhoneOS14.5.sdk "$HOME/sdk/" 2>/dev/null || cp -r /tmp/sdks-master/*.sdk "$HOME/sdk/"
          ls "$HOME/sdk"

      - name: 编译 XSao.dylib（扫码模块）
        run: |
          SDK="$HOME/sdk/iPhoneOS14.5.sdk"
          LLD="$(command -v ld64.lld || true)"
          if [ -n "$LLD" ]; then FUSE="-fuse-ld=$LLD"; else FUSE="-fuse-ld=lld"; fi
          clang -target arm64-apple-ios13.0 -isysroot "$SDK" -dynamiclib \
            -fobjc-arc -fblocks -O2 $FUSE \
            -framework UIKit -framework Foundation -framework AVFoundation \
            -framework Vision -framework CoreImage -framework CoreMedia -framework AudioToolbox \
            -Wl,-undefined,dynamic_lookup -Wl,-install_name,@executable_path/Frameworks/XSao.dylib \
            -o XSao.dylib -x objective-c \
            qrkit/XSao.xm qrkit/QRScannerViewController.m qrkit/QRCodeUtil.m 2>&1 | tee build.log
          ls -la XSao.dylib

      - uses: actions/upload-artifact@v4
        with:
          name: XSao-dylib
          path: |
            XSao.dylib
            build.log
          if-no-files-found: warn
